# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: mise
description: Adds the glibc-linked mise version manager to glibc-based workloads.
provides: ["mise@1"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: [sh, /usr/local/share/mise/activate-bash.sh]
          user: agent
          description: Activate mise in interactive Bash sessions

args:
  version:
    default: ""
    pattern: '^([0-9]+\.[0-9]+\.[0-9]+)?$'
    description: Optional mise release override; empty selects the latest eligible stable release
    buildArg: MISE_VERSION
