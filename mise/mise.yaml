# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: mise
description: Adds the mise version manager to an Alpine-based workload.

args:
  version:
    default: ""
    pattern: '^([0-9]+\.[0-9]+\.[0-9]+)?$'
    description: Optional mise release override; empty selects the latest eligible stable release
    buildArg: MISE_VERSION
